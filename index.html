<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이도준 · 3D 작업 모음</title><style>
:root{color-scheme:dark;--bg:#101211;--text:#f0eee6;--muted:#aaa99f;--accent:#d5ef9c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,'Malgun Gothic',sans-serif}button,a{font:inherit}button{cursor:pointer;color:inherit;background:transparent;border:1px solid #55584e;padding:9px 17px;border-radius:30px}button:hover,button.active{background:var(--accent);color:#171a12;border-color:var(--accent)}a{color:inherit}header{padding:20px 4vw;display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #35382e;position:sticky;top:0;background:#101211f5;z-index:3}header strong{letter-spacing:.12em;font-size:13px}nav{display:flex;gap:8px;flex-wrap:wrap}main{max-width:1500px;margin:auto;padding:45px 4vw}h1{font-size:clamp(36px,5vw,72px);font-weight:500;line-height:1.15;margin:18px 0}h2{font-size:clamp(25px,3vw,42px);line-height:1.2;margin:12px 0}p{color:var(--muted)}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.17em}.intro{max-width:780px;margin-bottom:48px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}.card{cursor:pointer;text-align:left;background:none;border:0;border-radius:0;padding:0;color:inherit}.card:hover{background:none;color:var(--accent)}.card img{width:100%;aspect-ratio:16/10;object-fit:contain;background:#080908;border:1px solid #30332a}.card h3{margin:13px 0 4px;font-size:22px;font-weight:500}.card p{margin:0;font-size:14px}.card small{color:var(--accent)}.detailhead{display:flex;justify-content:space-between;gap:24px;align-items:center;margin-bottom:24px}.hero{width:100%;max-height:72vh;object-fit:contain;background:#050605}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:24px 0}.gallery img{width:100%;cursor:zoom-in}details{border-top:1px solid #444;padding:22px 0;margin-top:24px}summary{cursor:pointer;font-size:19px}.player{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px}.player video{width:100%;height:62vh;background:#000;object-fit:contain}.playlist{max-height:70vh;overflow:auto}.track{width:100%;border-radius:0;text-align:left;border:0;border-bottom:1px solid #393d32;display:flex;align-items:center;gap:14px;padding:13px 8px}.track img{width:90px;aspect-ratio:16/9;object-fit:cover}.track span{font-size:14px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0}.caption{font-size:13px;color:var(--muted)}dialog{max-width:96vw;max-height:96vh;border:0;background:#080908;padding:35px 10px 10px}dialog::backdrop{background:#000d}dialog img{max-width:90vw;max-height:84vh}dialog button{position:absolute;top:0;right:10px;padding:0 10px}.present header{position:static}.present .intro{display:none}footer{margin-top:55px;border-top:1px solid #35382e;padding-top:20px;font-size:12px;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.player{grid-template-columns:1fr}.playlist{max-height:280px}.player video{height:48vh}header{position:static;align-items:flex-start;flex-direction:column}.gallery{grid-template-columns:1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}.detailhead{align-items:flex-start;flex-direction:column}}
dialog#lightbox{width:100vw;height:100vh;max-width:100vw;max-height:100vh;margin:0;padding:0;overflow:hidden}#lightbox:fullscreen{width:100vw;height:100vh}.viewerbar{height:64px;display:flex;align-items:center;justify-content:center;gap:8px;background:#151813;padding:8px;flex-wrap:wrap}.viewerbar button{position:static;padding:5px 12px;font-size:14px}#imageStage{height:calc(100% - 64px);overflow:auto;display:block;text-align:center}#slideImage{display:block;margin:auto;max-width:none;max-height:none;object-fit:contain}.viewerbar span{min-width:60px;font-size:13px}@media(max-width:650px){.viewerbar{height:110px}#imageStage{height:calc(100% - 110px)}} .credit{margin-top:4px;font-size:11px;letter-spacing:.12em;color:var(--muted)}</style><header><div><strong>DO JUNE LEE / SELECTED WORKS</strong><div class="credit">WITH THE SUPPORT OF JAEBEOM LEE · 이재범</div></div><nav><button id="workTab" onclick="overview()">작업별 보기</button><button id="videoTab" onclick="videoMode()">영상 모아보기 · 9</button><button onclick="fullscreen()">전체 화면</button></nav></header><main id="main"></main><dialog id="lightbox"><div class="viewerbar"><button onclick="moveSlide(-1)">← 이전</button><span id="slideCount"></span><button onclick="moveSlide(1)">다음 →</button><button onclick="scaleSlide(-.25)">− 축소</button><button onclick="scaleSlide(.25)">+ 확대</button><button onclick="fitSlide()">화면 맞춤</button><button onclick="viewerFull()">전체 화면</button><button onclick="closeViewer()">닫기 ×</button></div><div id="imageStage"><img id="slideImage" alt="작업 이미지 확대"></div></dialog><script src="data.js"></script><script>
let current=-1,queue=videos.map(v=>v.id),track=0;
const main=document.getElementById('main');
const pic=n=>`assets/p${n}.jpg`;
function tabs(v){document.getElementById('workTab').classList.toggle('active',!v);document.getElementById('videoTab').classList.toggle('active',v)}
function footer(){return '<footer>이도준 · 3D 작업 모음 / 2019–2020 재학 중 작업 및 실험<br>기존 포트폴리오의 이미지·발표자료와 보관 중인 원본 영상을 모았습니다.</footer>'}
function stop(){document.querySelectorAll('video').forEach(v=>v.pause())}
function overview(){stop();current=-1;tabs(false);main.innerHTML=`<div class="intro"><div class="eyebrow">3D MODELING · PRODUCT DESIGN · MOTION</div><h1>형태를 만들고,<br>움직임으로 살펴보다.</h1><p>2019–2020년 재학 중 진행한 3D 모델링 연구 및 활용 사례.<br>작업을 선택하면 결과물과 제작 과정을 함께 볼 수 있습니다.</p><button onclick="videoMode()">영상 9개 이어보기 ↗</button></div><div class="grid">${projects.map((p,i)=>`<button class="card" onclick="project(${i})"><img src="${pic(p.cover)}" alt="${p.title}" loading="lazy"><small>${String(i+1).padStart(2,'0')}${p.videos.length?' / VIDEO':''}</small><h3>${p.title}</h3><p>${p.meta||""}</p><p>${p.desc}</p></button>`).join('')}</div>${footer()}`;window.scrollTo(0,0)}
function project(i){stop();current=i;tabs(false);const p=projects[i];main.innerHTML=`<div class="detailhead"><div><div class="eyebrow">SELECTED WORK ${String(i+1).padStart(2,'0')} / ${projects.length}</div><h2>${p.title}</h2>${p.meta?`<div class="eyebrow">${p.meta}</div>`:""}<p>${p.desc}</p>${p.role?`<p style="color:var(--text);max-width:850px"><strong>담당 역할</strong><br>${p.role}</p>`:""}${p.modeling?`<p style="color:var(--text)"><strong>사용 툴</strong><br>모델링: ${p.modeling}<br>렌더링: ${p.rendering}</p>`:""}</div><button onclick="overview()">전체 작업</button></div>${p.videos.length?`<video class="hero" controls playsinline preload="metadata" poster="${pic(p.cover)}" src="assets/media${p.videos[0]}.mp4"></video>${p.videos.length>1?'<div class="controls"><button onclick="videoMode(projects[current].videos)">실험 영상 6개 이어보기</button></div>':''}`:`<img class="hero" src="${pic(p.cover)}" alt="${p.title}">`}<details ${p.videos.length?'':'open'}><summary>결과 이미지와 제작 과정 · 해당 작업 자료 ${p.sourceCount}장 중 ${p.pages.length}장 선별</summary><p class="caption">제공된 150페이지 발췌 PDF의 해당 작업 구간을 기준으로 집계했습니다. 원래 포트폴리오 전체 분량과는 다릅니다.</p><div class="gallery">${p.pages.map(n=>`<img src="${pic(n)}" loading="lazy" alt="${p.title} · 원본 자료 ${n}페이지" onclick="zoom(this.src)">`).join('')}</div></details><div class="controls"><button onclick="project((${i}+projects.length-1)%projects.length)">← 이전 작업</button><span>${i+1} / ${projects.length}</span><button onclick="project((${i}+1)%projects.length)">다음 작업 →</button></div>${footer()}`;window.scrollTo(0,0)}
function videoMode(ids){stop();tabs(true);queue=ids||videos.map(v=>v.id);track=0;main.innerHTML=`<div class="detailhead"><div><div class="eyebrow">VIDEO COLLECTION</div><h2>영상으로 보는 작업</h2><p>제품 시연과 C4D 실험 영상 ${queue.length}개 · 목록에서 선택하거나 차례로 감상할 수 있습니다.</p></div></div><div class="player"><div><video id="screen" controls playsinline preload="metadata"></video><h3 id="videoTitle"></h3><div class="controls"><button onclick="changeTrack(-1)">← 이전 영상</button><button onclick="changeTrack(1)">다음 영상 →</button><label><input type="checkbox" id="autonext" checked> 연속 재생</label></div><p class="caption" id="status" aria-live="polite">재생 버튼을 누르면 시작합니다. 각 영상의 소리는 원본 그대로 재생됩니다.</p></div><div class="playlist">${queue.map((id,j)=>{const v=videos.find(v=>v.id===id);return `<button class="track" id="track${j}" onclick="loadTrack(${j},true)"><img src="assets/v${id}.jpg" alt=""><span>${v.title}<br>${v.duration}</span></button>`}).join('')}</div></div>${footer()}`;document.getElementById('screen').onended=()=>{if(document.getElementById('autonext').checked&&track<queue.length-1)loadTrack(track+1,true);else document.getElementById('status').textContent='영상 재생이 끝났습니다.'};loadTrack(0,false);window.scrollTo(0,0)}
function loadTrack(j,play){track=j;const v=videos.find(v=>v.id===queue[j]),s=document.getElementById('screen');s.src=`assets/media${v.id}.mp4`;s.poster=`assets/v${v.id}.jpg`;document.getElementById('videoTitle').textContent=`${j+1} / ${queue.length} · ${v.title}`;document.querySelectorAll('.track').forEach((el,k)=>el.classList.toggle('active',k===j));s.onerror=()=>document.getElementById('status').textContent='영상을 불러오지 못했습니다. ZIP 전체를 압축 해제했는지 확인해 주세요.';if(play)s.play().catch(()=>document.getElementById('status').textContent='재생 버튼을 눌러 이어서 감상해 주세요.')}
function changeTrack(d){loadTrack((track+d+queue.length)%queue.length,true)}
let slideList=[],slideIndex=0,slideScale=1;
function zoom(src){slideList=[...document.querySelectorAll('.gallery img')].map(i=>i.src);slideIndex=slideList.indexOf(src);if(slideIndex<0){slideList=[src];slideIndex=0}document.getElementById('lightbox').showModal();showSlide()}
function showSlide(){const im=document.getElementById('slideImage');im.onload=()=>{slideScale=1;resizeSlide()};im.src=slideList[slideIndex];document.getElementById('slideCount').textContent=`${slideIndex+1} / ${slideList.length}`;if(im.complete&&im.naturalWidth){slideScale=1;resizeSlide()}}
function resizeSlide(){const im=document.getElementById('slideImage'),stage=document.getElementById('imageStage');if(!im.naturalWidth)return;const fit=Math.min(stage.clientWidth/im.naturalWidth,stage.clientHeight/im.naturalHeight);im.style.width=im.naturalWidth*fit*slideScale+'px';im.style.height=im.naturalHeight*fit*slideScale+'px'}
function scaleSlide(d){slideScale=Math.max(1,Math.min(5,slideScale+d));resizeSlide()}
function fitSlide(){slideScale=1;resizeSlide()}
function moveSlide(d){slideIndex=(slideIndex+d+slideList.length)%slideList.length;showSlide()}
async function viewerFull(){try{if(!document.fullscreenElement)await document.getElementById('lightbox').requestFullscreen();else await document.exitFullscreen()}catch(e){}setTimeout(resizeSlide,150)}
async function closeViewer(){if(document.fullscreenElement===document.getElementById('lightbox'))await document.exitFullscreen();document.getElementById('lightbox').close()}
window.addEventListener('resize',()=>{if(document.getElementById('lightbox').open)resizeSlide()});document.addEventListener('keydown',e=>{if(!document.getElementById('lightbox').open)return;if(e.key==='ArrowRight'){e.preventDefault();moveSlide(1)}if(e.key==='ArrowLeft'){e.preventDefault();moveSlide(-1)}if(e.key==='+')scaleSlide(.25);if(e.key==='-')scaleSlide(-.25)});

async function fullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}}
document.addEventListener('keydown',e=>{if(e.target.matches('input,button,video')||document.getElementById('lightbox').open)return;if(current>=0&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();project((current+(e.key==='ArrowRight'?1:-1)+projects.length)%projects.length)}});overview();
</script></html>
